# Host port publishing: use `docker-compose.dev.yml` (see ./scripts/dev-stack.sh) or the
# production overlay `deploy/docker-compose.production.yml` — not defined here on purpose.

services:
  postgres:
    image: postgres:14-alpine
    container_name: safro-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-callisto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-callisto}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-callisto} -d ${POSTGRES_DB:-callisto}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  hasura:
    image: hasura/graphql-engine:v2.0.4
    container_name: safro-hasura
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER:-callisto}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-callisto}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_ADMIN_SECRET: myadminsecretkey
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
      ACTION_BASE_URL: http://host.docker.internal:3001
    restart: always

volumes:
  postgres_data:
