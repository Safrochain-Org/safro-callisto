# Postgres + Hasura. Host Callisto uses POSTGRES_PORT on 127.0.0.1 (default 5434) — match .env and .callisto/config.yaml.
services:
  postgres:
    image: postgres:15-alpine
    container_name: safro-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-callisto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-callisto}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      # Defaults match POSTGRES_*; change if you override POSTGRES_USER/POSTGRES_DB
      test: ["CMD-SHELL", "pg_isready -U callisto -d callisto"]
      interval: 5s
      timeout: 5s
      retries: 10

  hasura:
    # v2.0.4 is amd64-only; on Apple Silicon Docker runs it via emulation unless you upgrade to a multi-arch tag.
    image: hasura/graphql-engine:v2.0.4
    platform: linux/amd64
    container_name: safro-hasura
    depends_on:
      postgres:
        condition: service_healthy
    # Callisto actions run on the host (.callisto/config.yaml actions.port); Hasura needs to reach them from the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    restart: always
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      # Required by metadata actions (see hasura/metadata/actions.yaml). Override in .env if needed.
      ACTION_BASE_URL: ${ACTION_BASE_URL:-http://host.docker.internal:3001}
      # HASURA_GRAPHQL_ADMIN_SECRET: myadminsecretkey
  # Optional; host Callisto is the usual setup. To run: docker compose --profile callisto-docker up -d
  callisto:
    profiles: ["callisto-docker"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: callisto parse --home /callisto/.callisto
    volumes:
      - /callisto/.callisto:/callisto/.callisto

volumes:
  postgres_data:
