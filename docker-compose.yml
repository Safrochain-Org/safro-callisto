# Hasura only — Postgres runs on the host (see scripts/setup-db.sh).
# GraphQL: http://127.0.0.1:8080

services:
  hasura:
    image: hasura/graphql-engine:v2.0.4
    container_name: safro-hasura
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER:-callisto}:${POSTGRES_PASSWORD:-password}@host.docker.internal:5432/${POSTGRES_DB:-callisto}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-myadminsecretkey}
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
      ACTION_BASE_URL: http://host.docker.internal:3001
    restart: always
